version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: readmissions-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hospital_readmissions
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospital_readmissions"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: readmissions-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/hospital_readmissions
      - CORS_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:5173,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/workspace/models
      - ./data:/workspace/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: readmissions-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    container_name: readmissions-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vitals.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:

